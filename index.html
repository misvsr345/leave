<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VSR GOLD — Photos</title>
<style>
  :root{
    --purple:#4A0E8F; --purple-mid:#7B2FBE; --gold:#D4AF37;
    --bg:#F7F3FB; --card:#ffffff; --border:#E2D9EE; --text:#241A33; --dmuted:#7D6E8C;
    --red:#C0392B; --green:#2E8B57;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  .frame{max-width:1000px;margin:0 auto;min-height:100vh;background:var(--card);border-left:1px solid var(--border);border-right:1px solid var(--border);box-shadow:0 0 40px rgba(74,14,143,.08);}
  header{background:var(--purple);color:#fff;padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.18);border-bottom:3px solid var(--gold);}
  header .brandline{display:flex;align-items:center;gap:2px;}
  header .brandline::before,header .brandline::after{content:'';width:22px;height:1px;background:var(--gold);opacity:.7;}
  header .title{font-weight:800;font-size:19px;letter-spacing:2.5px;padding:0 8px;}
  header small{display:block;font-size:10.5px;font-weight:600;color:var(--gold);letter-spacing:1.6px;margin-top:5px;text-transform:uppercase;}
  .wrap{max-width:960px;margin:0 auto;padding:14px;}
  .card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px;}
  .brand-footer{border-top:3px solid var(--gold);background:var(--purple);color:#fff;text-align:center;padding:18px 16px 20px;margin-top:8px;}
  .brand-footer .fname{font-weight:800;font-size:15px;letter-spacing:2px;}
  .brand-footer .faddr{font-size:12px;color:#e6d9f5;margin-top:5px;line-height:1.5;}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .filters .full{grid-column:1/-1;}
  label{display:block;font-size:11.5px;font-weight:700;color:var(--dmuted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px;}
  select,input[type=text]{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:#fff;color:var(--text);}
  select:focus,input:focus{outline:none;border-color:var(--purple-mid);}
  .btn{width:100%;padding:12px;border:none;border-radius:10px;background:var(--purple);color:#fff;font-weight:800;font-size:14.5px;cursor:pointer;letter-spacing:.2px;}
  .btn:active{background:var(--purple-mid);}
  .btn-sec{background:#fff;color:var(--purple);border:1.5px solid var(--purple);}
  .note{font-size:12px;color:var(--dmuted);text-align:center;padding:6px 0;}
  .empty{text-align:center;padding:40px 16px;color:var(--dmuted);}
  .spinner{display:inline-block;width:16px;height:16px;border:2.5px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading{text-align:center;padding:30px 0;color:var(--dmuted);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;}
  .tile{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;border:1.5px solid var(--border);cursor:pointer;background:#f0eaf7;}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .tile .pill{position:absolute;top:4px;left:4px;font-size:9px;font-weight:800;padding:2px 6px;border-radius:20px;color:#fff;letter-spacing:.3px;}
  .tile .tag{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:10.5px;font-weight:700;padding:12px 6px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tile.tile-offline{background:#e8e2f0;}
  .tile.tile-offline::before{content:'📷';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;opacity:.35;}
  #offlineBanner{display:none;background:#8a5a00;color:#fff;font-size:12px;font-weight:700;text-align:center;padding:7px 10px;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:flex;align-items:center;justify-content:center;padding:0;}
  .stage-box{width:100%;height:100%;max-width:640px;max-height:100vh;background:#0c0c0c;position:relative;display:flex;flex-direction:column;}
  .close-x{position:absolute;top:8px;right:10px;z-index:6;background:rgba(255,255,255,.12);color:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;}
  /* Stage height is FIXED (not "flex:1" sized off whatever else is on screen) so the photo frame stays
     the exact same size photo to photo — BRO: "click cheste pedda size lo view vastundi, kani slide
     chesinappudu malli size lo changes vastundi, so ala kakunda chudu". object-fit:contain then just
     fits each photo, portrait or landscape, inside that same fixed frame instead of the frame itself
     growing/shrinking. The info table below is now always shown (never toggled), which is the other
     half of what caused the size jump — the stage no longer grows into the space the table used to free
     up when it was hidden. */
  .stage{position:relative;height:56vh;flex:0 0 auto;display:flex;align-items:center;justify-content:center;touch-action:pan-y;overflow:hidden;background:#000;}
  .stage img{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in;}
  .nav-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:4;background:rgba(255,255,255,.14);color:#fff;border:none;width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer;}
  .nav-btn.left{left:8px;} .nav-btn.right{right:8px;}
  .ctr-lbl{text-align:center;color:#ddd;font-size:11.5px;padding:8px 0;background:#0c0c0c;flex-shrink:0;}
  .info-box{display:block;background:#fff;border-top:2px solid var(--gold);padding:8px 14px;max-height:26vh;overflow-y:auto;flex-shrink:0;}
  table.info{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.info td{padding:5px 4px;border-bottom:1px dashed var(--border);}
  table.info td.lbl{color:var(--dmuted);font-weight:700;width:42%;}
  table.info td.val{font-weight:600;}

  /* Tablet / larger screens: the lightbox gets real room to breathe instead of stretching a small
     photo edge-to-edge — BRO: "tablet size screen ki image fit avali". */
  @media (min-width:600px){ .filters{grid-template-columns:1fr 1fr 1fr;} }
  @media (min-width:768px){
    .overlay{padding:24px;}
    .stage-box{max-width:820px;max-height:92vh;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  }
  @media (min-width:1100px){ .stage-box{max-width:960px;} }
</style>
</head>
<body>

<div class="frame">
<header>
  <div class="brandline"><div class="title">VSR GOLD</div></div>
  <small>Stock Photos</small>
</header>
<div id="offlineBanner">📴 Offline — showing saved photos</div>

<div class="wrap">
  <div class="card">
    <div class="filters">
      <div><label>Show</label>
        <select id="phStatus" onchange="filtersChanged('status')">
          <option value="instock">In Stock only</option>
          <option value="sold">Sold only</option>
          <option value="all" selected>All (In Stock + Sold)</option>
        </select>
      </div>
      <div><label>Counter</label><select id="phCounter" onchange="filtersChanged('counter')"><option value="">All</option></select></div>
      <div><label>Product</label><select id="phProduct" onchange="filtersChanged('product')"><option value="">All</option></select></div>
    </div>
    <div class="filters" id="phDimFilters"><!-- Design + product-specific size filters (Chain: Wt/Length, Bangle/Sankha: Bangle Size, Finger Ring: Ring Size) fill in here once a Product is picked --></div>
    <div class="filters">
      <div class="full" style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
        <input type="checkbox" id="phWtRangeOn" onchange="toggleWtRange()" style="width:18px;height:18px;margin:0;">
        <label style="margin:0;text-transform:none;font-size:13.5px;color:var(--text);">Weight Range (gm)</label>
      </div>
    </div>
    <div class="filters" id="phWtRangeBox" style="display:none;">
      <div><label>From Wt</label><select id="phWtFrom" onchange="applyFiltersAndRender()"><option value="">Any</option></select></div>
      <div><label>To Wt</label><select id="phWtTo" onchange="applyFiltersAndRender()"><option value="">Any</option></select></div>
    </div>
    <div class="filters">
      <div class="full"><label>Search</label><input type="text" id="phQ" placeholder="Tag No or Product name..." autocomplete="off" oninput="applyFiltersAndRender()" onkeydown="if(event.key==='Enter')applyFiltersAndRender()"></div>
    </div>
    <button class="btn" onclick="applyFiltersAndRender()">🔍 Show Photos</button>
  </div>

  <div id="grid" class="grid"></div>
  <div id="moreWrap" class="note"></div>
</div>

<footer class="brand-footer">
  <div class="fname">VSR GOLD</div>
  <div class="faddr" id="storeAddr"></div>
</footer>
</div><!-- /.frame -->

<script>
// ============================================================
// VSR GOLD — Stock Photos viewer (standalone, GitHub-hosted).
// Only job: browse the Stock/Sold photos already in the Stock Level Google Sheet, tap to view full
// size, swipe/arrow to move between photos, tap the photo itself to show/hide that item's Sheet data.
// Talks directly to the Stock Level Apps Script Web App below.
//
// OFFLINE (BRO: "off line lo kuda kanipinchali, once load aindi malli load avakudadu"): the FULL photo
// list is fetched ONCE per app open (paginating behind the scenes) and cached in IndexedDB, and every
// filter/search after that is answered from that in-memory copy — no repeat server calls per filter
// click. Each photo's image is also cached as a blob the first time it's actually viewed, so once
// you've opened the app with internet at least once, both the item list and every photo you've already
// looked at keep working with no internet at all. A background refresh runs on every open (and again
// the moment you come back online) to pick up new stock, but the screen never waits on it — cached data
// (if any) renders first, instantly.
// ============================================================

// PASTE your Stock Level Web App URL here (same one used by the main portal's STOCK_GAS_URL).
const STOCK_GAS_URL = "https://script.google.com/macros/s/AKfycbyZR0GpuTCgy2ErrFO4DOyBaN2USByivHUxN1QOeR67mkRM0l_pcmnodBt41KF29Wi0/exec";

// EDIT THIS: your store's address, shown in the footer at the bottom of the page.
const STORE_ADDRESS = "Your Store Address Line, City - PIN";

const PH = { items: [], openIdx: -1, limit: 60 };
const VISIBLE = { count: 0 };
let ALL_ITEMS = [];
document.getElementById('storeAddr').textContent = STORE_ADDRESS;

function escHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDMY(s) {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d.getTime())) return String(s);
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
}
function normTag(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
function api(params) {
  const qs = Object.entries(params).map(([k, v]) => k + '=' + encodeURIComponent(v == null ? '' : v)).join('&');
  return fetch(STOCK_GAS_URL + '?' + qs).then(r => r.json());
}

// ---- IndexedDB: 'meta' store holds the one cached full item list; 'images' store holds one blob per
// Drive file id (shared size for grid + lightbox, so a photo is only ever downloaded once). ----
const IDB_NAME = 'vsrStockPhotosDB', IDB_VERSION = 1;
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
      if (!db.objectStoreNames.contains('images')) db.createObjectStore('images');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbGet(store, key) {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const rq = db.transaction(store, 'readonly').objectStore(store).get(key);
      rq.onsuccess = () => resolve(rq.result);
      rq.onerror = () => reject(rq.error);
    });
  } catch (e) { return undefined; }
}
async function idbSet(store, key, val) {
  try {
    const db = await idbOpen();
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).put(val, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { return false; }
}

function extractDriveId(photo) {
  if (!photo) return null;
  const m = String(photo).match(/[?&]id=([\w-]+)/) || String(photo).match(/\/d\/([\w-]+)/);
  return m ? m[1] : null;
}
// Cache-first image loader: reused blob if we've already downloaded this photo (works fully offline);
// otherwise fetches it once (trying two Google CDN URL forms) and caches the blob for next time. When
// offline and never cached, resolves null so the tile can show a "not available offline" placeholder
// instead of a broken image.
async function resolveImgSrc(photo) {
  const id = extractDriveId(photo);
  if (!id) return photo || null;
  const cached = await idbGet('images', id);
  if (cached) return URL.createObjectURL(cached);
  if (!navigator.onLine) return null;
  const urls = [`https://lh3.googleusercontent.com/d/${id}=w1000`, `https://drive.google.com/thumbnail?id=${id}&sz=w1000`];
  for (const u of urls) {
    try {
      const resp = await fetch(u);
      if (!resp.ok) continue;
      const blob = await resp.blob();
      idbSet('images', id, blob);
      return URL.createObjectURL(blob);
    } catch (e) {}
  }
  return null;
}

function updateOnlineBanner() {
  const b = document.getElementById('offlineBanner');
  if (b) b.style.display = navigator.onLine ? 'none' : 'block';
}
window.addEventListener('online', () => { updateOnlineBanner(); refreshSnapshot(); });
window.addEventListener('offline', updateOnlineBanner);

// Pulls every photographed item (Stock + Sold) in pages behind the scenes, so the rest of the app can
// treat it as one flat, already-fetched array.
async function fetchFullSnapshot() {
  let offset = 0, total = Infinity, rows = [];
  while (offset < total && rows.length < 8000) {
    const res = await api({ action: 'photoGallery', status: 'all', limit: 300, offset });
    if (!res || !res.ok) throw new Error((res && res.error) || 'Could not load photos.');
    total = res.total || 0;
    const got = res.rows || [];
    rows = rows.concat(got);
    offset += got.length;
    if (!got.length) break;
  }
  return rows;
}
async function refreshSnapshot() {
  if (!navigator.onLine) return;
  try {
    const rows = await fetchFullSnapshot();
    ALL_ITEMS = rows;
    idbSet('meta', 'snapshot', { rows, fetchedAt: Date.now() });
    renderFiltersFromData();
    applyFiltersAndRender();
  } catch (e) {
    if (!ALL_ITEMS.length) {
      document.getElementById('grid').innerHTML = `<div class="empty">Could not load photos (${escHtml(e && e.message ? e.message : e)}). Connect to the internet once to load photos for offline use.</div>`;
    }
  }
}
async function initApp() {
  updateOnlineBanner();
  const cached = await idbGet('meta', 'snapshot');
  if (cached && cached.rows && cached.rows.length) {
    ALL_ITEMS = cached.rows;
    renderFiltersFromData();
    applyFiltersAndRender();
  } else {
    document.getElementById('grid').innerHTML = '<div class="loading"><span class="spinner"></span>Loading...</div>';
  }
  refreshSnapshot();
}

// ---- Cascading filters (BRO: "counter select cheste aa counter lo unnavi matrame Product list lo
// ravali; Chain select cheste Weight/Length, Bangle/Sankha select cheste Bangle Size, Finger Ring
// select cheste Finger Size adagali") — computed straight from ALL_ITEMS in memory, so this keeps
// working offline too, with no server round trip per filter change. ----
function productKind(productName) {
  const p = String(productName || '').toLowerCase();
  if (p.indexOf('chain') !== -1) return 'chain';
  if (p.indexOf('bangle') !== -1 || p.indexOf('sankha') !== -1) return 'bangle';
  if (p.indexOf('ring') !== -1 && p.indexOf('ear') === -1) return 'ring'; // "Finger Ring", not "Ear Ring"
  return '';
}
// Plain numeric strings ("3", "16", "0.3") sort as real numbers so a dropdown of weights doesn't end up
// as 0.3, 0.9, 0.16, 0.17... (BRO: "drop lo numbers wrong ga vastundi") — that happened because
// localeCompare's "numeric" mode compares digit-RUNS the way version numbers do (splitting on the
// decimal point), which is wrong for decimals: "0.3" vs "0.16" compared "3" against "16" and put 0.3
// first. A mixed format like a bangle size "2/4" still isn't a plain number, so it keeps using
// localeCompare's numeric mode, which is the right tool for that. ----
function smartCompare(a, b) {
  const isPlainNum = s => /^-?\d+(\.\d+)?$/.test(s.trim());
  if (isPlainNum(a) && isPlainNum(b)) return parseFloat(a) - parseFloat(b);
  return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
}
function uniqSorted(values) {
  return Array.from(new Set(values.map(v => String(v == null ? '' : v).trim()).filter(Boolean)))
    .sort(smartCompare);
}
function scopeItems(status, counter, product) {
  return ALL_ITEMS.filter(r =>
    (status === 'all' || r.status === status) &&
    (!counter || (r.counter || '').trim() === counter) &&
    (!product || (r.productName || '').trim() === product)
  );
}
function filtersChanged(which) {
  if (which === 'status' || which === 'counter') {
    reloadProductOptions();
    document.getElementById('phProduct').value = '';
    reloadDimFilters();
  } else if (which === 'product') {
    reloadDimFilters();
  }
  applyFiltersAndRender();
}
function renderFiltersFromData() {
  const counterSel = document.getElementById('phCounter');
  const keepCounter = counterSel.value;
  const counters = uniqSorted(ALL_ITEMS.map(r => r.counter));
  counterSel.innerHTML = '<option value="">All</option>' + counters.map(c => `<option${c === keepCounter ? ' selected' : ''}>${escHtml(c)}</option>`).join('');
  reloadProductOptions();
  populateWtRangeOptions();
}

// ---- Weight Range filter (BRO: "2 nundi 5 gr lopu items chupinchu ante, tick box, from wt/to wt
// dropdown, aa rendu wt lopu unnavi matrame ravali") — independent of the other filters, works off the
// full weight list across all items, ANDs with whatever else is selected. ----
function populateWtRangeOptions() {
  const fromSel = document.getElementById('phWtFrom'), toSel = document.getElementById('phWtTo');
  if (!fromSel || !toSel) return;
  const keepFrom = fromSel.value, keepTo = toSel.value;
  const weights = uniqSorted(ALL_ITEMS.map(r => r.weight)).filter(w => !isNaN(parseFloat(w)));
  const opts = '<option value="">Any</option>' + weights.map(w => `<option>${escHtml(w)}</option>`).join('');
  fromSel.innerHTML = opts; toSel.innerHTML = opts;
  fromSel.value = keepFrom; toSel.value = keepTo;
}
function toggleWtRange() {
  const on = document.getElementById('phWtRangeOn').checked;
  document.getElementById('phWtRangeBox').style.display = on ? 'grid' : 'none';
  applyFiltersAndRender();
}
function reloadProductOptions() {
  const sel = document.getElementById('phProduct'); if (!sel) return;
  const keep = sel.value;
  const status = document.getElementById('phStatus').value, counter = document.getElementById('phCounter').value;
  const products = uniqSorted(scopeItems(status, counter, '').map(r => r.productName));
  sel.innerHTML = '<option value="">All</option>' + products.map(p => `<option${p === keep ? ' selected' : ''}>${escHtml(p)}</option>`).join('');
  reloadDimFilters();
}
function reloadDimFilters() {
  const status = document.getElementById('phStatus').value, counter = document.getElementById('phCounter').value;
  const product = document.getElementById('phProduct').value;
  const scoped = scopeItems(status, counter, product);
  renderDimFilters({
    designs: uniqSorted(scoped.map(r => r.design)),
    weights: uniqSorted(scoped.map(r => r.weight)),
    lengths: uniqSorted(scoped.map(r => r.length)),
    bangleSizes: uniqSorted(scoped.map(r => r.bangleSize)),
    ringSizes: uniqSorted(scoped.map(r => r.ringSize))
  }, product);
}
function renderDimFilters(opts, product) {
  const wrap = document.getElementById('phDimFilters'); if (!wrap) return;
  const kind = productKind(product);
  let html = `<div><label>Design</label><select id="phDesign" onchange="applyFiltersAndRender()"><option value="">All</option>${(opts.designs || []).map(d => `<option>${escHtml(d)}</option>`).join('')}</select></div>`;
  if (kind === 'chain') {
    html += `<div><label>Weight (gm)</label><select id="phWeight" onchange="applyFiltersAndRender()"><option value="">All</option>${(opts.weights || []).map(w => `<option>${escHtml(w)}</option>`).join('')}</select></div>`;
    html += `<div><label>Length</label><select id="phLength" onchange="applyFiltersAndRender()"><option value="">All</option>${(opts.lengths || []).map(l => `<option>${escHtml(l)}</option>`).join('')}</select></div>`;
  } else if (kind === 'bangle') {
    html += `<div><label>Bangle Size</label><select id="phBangleSize" onchange="applyFiltersAndRender()"><option value="">All</option>${(opts.bangleSizes || []).map(b => `<option>${escHtml(b)}</option>`).join('')}</select></div>`;
  } else if (kind === 'ring') {
    html += `<div><label>Finger Size</label><select id="phRingSize" onchange="applyFiltersAndRender()"><option value="">All</option>${(opts.ringSizes || []).map(r => `<option>${escHtml(r)}</option>`).join('')}</select></div>`;
  }
  wrap.innerHTML = html;
}

// ---- Filtering + rendering, all local (instant, works offline) ----
function currentFilters() {
  const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  return {
    status: document.getElementById('phStatus').value, counter: document.getElementById('phCounter').value,
    product: val('phProduct'), design: val('phDesign'),
    weight: val('phWeight'), length: val('phLength'), bangleSize: val('phBangleSize'), ringSize: val('phRingSize'),
    wtRangeOn: document.getElementById('phWtRangeOn').checked,
    wtFrom: val('phWtFrom'), wtTo: val('phWtTo'),
    q: document.getElementById('phQ').value.trim().toUpperCase()
  };
}
function filterItems(items, f) {
  const wtFrom = f.wtRangeOn && f.wtFrom !== '' ? parseFloat(f.wtFrom) : null;
  const wtTo = f.wtRangeOn && f.wtTo !== '' ? parseFloat(f.wtTo) : null;
  return items.filter(r => {
    if (f.status !== 'all' && r.status !== f.status) return false;
    if (f.counter && (r.counter || '').trim() !== f.counter) return false;
    if (f.product && (r.productName || '').trim() !== f.product) return false;
    if (f.design && (r.design || '').trim() !== f.design) return false;
    if (f.weight && String(r.weight || '').trim() !== f.weight) return false;
    if (f.length && String(r.length || '').trim() !== f.length) return false;
    if (f.bangleSize && String(r.bangleSize || '').trim() !== f.bangleSize) return false;
    if (f.ringSize && String(r.ringSize || '').trim() !== f.ringSize) return false;
    if (wtFrom != null || wtTo != null) {
      const w = parseFloat(r.weight);
      if (isNaN(w)) return false;
      if (wtFrom != null && w < wtFrom) return false;
      if (wtTo != null && w > wtTo) return false;
    }
    if (f.q && normTag(r.tagNo).indexOf(normTag(f.q)) === -1 && (r.productName || '').toUpperCase().indexOf(f.q) === -1) return false;
    return true;
  }).sort((a, b) => new Date(b.addedAt || 0) - new Date(a.addedAt || 0));
}
function applyFiltersAndRender() {
  PH.items = filterItems(ALL_ITEMS, currentFilters());
  VISIBLE.count = Math.min(PH.limit, PH.items.length);
  renderGrid();
}
function renderGrid() {
  const grid = document.getElementById('grid'), moreWrap = document.getElementById('moreWrap');
  if (!PH.items.length) { grid.innerHTML = '<div class="empty">No photos found for this filter.</div>'; moreWrap.innerHTML = ''; return; }
  grid.innerHTML = PH.items.slice(0, VISIBLE.count).map((r, i) => tileHtml(r, i)).join('');
  hydrateVisibleImages();
  moreWrap.innerHTML = (VISIBLE.count < PH.items.length)
    ? `<button class="btn btn-sec" style="width:auto;padding:9px 22px;" onclick="loadMore()">Load more (${VISIBLE.count} of ${PH.items.length})</button>`
    : `${PH.items.length} of ${PH.items.length} shown`;
}
function loadMore() { VISIBLE.count = Math.min(VISIBLE.count + PH.limit, PH.items.length); renderGrid(); }

function tileHtml(r, idx) {
  const pill = r.status === 'sold' ? '<span class="pill" style="background:var(--red);">SOLD</span>' : '<span class="pill" style="background:var(--green);">STOCK</span>';
  const label = r.tagNo || r.productName || 'Item';
  return `<div class="tile" data-photo="${escHtml(r.photo || '')}" onclick="openViewer(${idx})">
      <img alt="${escHtml(label)}">
      ${pill}
      <div class="tag">${escHtml(label)}</div>
    </div>`;
}
function hydrateVisibleImages() {
  document.querySelectorAll('#grid .tile[data-photo]').forEach(tile => {
    const photo = tile.getAttribute('data-photo');
    tile.removeAttribute('data-photo');
    const img = tile.querySelector('img');
    resolveImgSrc(photo).then(src => { if (src) img.src = src; else tile.classList.add('tile-offline'); });
  });
}

// ---- Lightbox: tap a thumbnail -> big photo; swipe or ◀▶ -> next/prev; tap the photo itself ->
// show/hide a small box with that item's Sheet data. ----
function openViewer(idx) {
  PH.openIdx = idx; PH.infoOpen = false;
  const old = document.getElementById('phModal'); if (old) old.remove();
  const div = document.createElement('div');
  div.id = 'phModal';
  div.className = 'overlay';
  div.innerHTML = `<div class="stage-box">
      <button class="close-x" onclick="document.getElementById('phModal').remove()">✕</button>
      <div id="phStage" class="stage" style="touch-action:none;overflow:hidden;">
        <button class="nav-btn left" onclick="navPhoto(-1)">◀</button>
        <img id="phStageImg" src="" style="user-select:none;-webkit-user-drag:none;">
        <button class="nav-btn right" onclick="navPhoto(1)">▶</button>
        <div style="position:absolute;bottom:6px;right:8px;z-index:4;display:flex;gap:6px;">
          <button class="nav-btn" style="position:static;width:32px;height:32px;font-size:16px;" onclick="sharePhoto()" title="Share">📤</button>
          <button class="nav-btn" style="position:static;width:32px;height:32px;font-size:18px;" onclick="zoomBy(-0.6)" title="Zoom out">−</button>
          <button class="nav-btn" style="position:static;width:32px;height:32px;font-size:18px;" onclick="zoomBy(0.6)" title="Zoom in">+</button>
        </div>
      </div>
      <div id="phCtrLbl" class="ctr-lbl"></div>
      <div id="phInfoBox" class="info-box"></div>
    </div>`;
  document.body.appendChild(div);
  div.addEventListener('click', e => { if (e.target === div) div.remove(); });

  document.addEventListener('keydown', keyNav);
  setupZoomPan();
  renderStage();
}
function keyNav(e) {
  if (!document.getElementById('phModal')) { document.removeEventListener('keydown', keyNav); return; }
  if (e.key === 'ArrowLeft') navPhoto(-1);
  else if (e.key === 'ArrowRight') navPhoto(1);
  else if (e.key === 'Escape') document.getElementById('phModal').remove();
  else if (e.key === '+' || e.key === '=') zoomBy(0.6);
  else if (e.key === '-') zoomBy(-0.6);
}
function navPhoto(dir) {
  const n = PH.items.length; if (!n) return;
  PH.openIdx = (PH.openIdx + dir + n) % n;
  PH.infoOpen = false; // sliding to a new photo always starts image-only
  if (window.__phResetZoom) window.__phResetZoom(); // new photo always starts at 1x
  renderStage();
}

// ---- Zoom / pan: mouse wheel / +− buttons / keyboard +− on desktop; pinch (2-finger) + double-tap
// on touch. A single tap/click still toggles the small detail box — told apart from a double-tap with
// a short timer. Swipe-to-next-photo only fires at 1x zoom; once zoomed in, one-finger drag pans. ----
function setupZoomPan() {
  const stage = document.getElementById('phStage');
  const img = document.getElementById('phStageImg');
  if (!stage || !img) return;
  let scale = 1, tx = 0, ty = 0;
  let pinchStartDist = 0, pinchStartScale = 1;
  let dragging = false, dragStartX = 0, dragStartY = 0, dragOrigTx = 0, dragOrigTy = 0;
  let swipeStartX = null;
  let tapTimer = null, lastTapAt = 0;

  const clampScale = s => Math.max(1, Math.min(4, s));
  const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; img.style.cursor = scale > 1.01 ? 'grab' : 'zoom-in'; };
  window.__phResetZoom = () => { scale = 1; tx = 0; ty = 0; apply(); };
  window.__phZoomBy = (delta) => { scale = clampScale(scale + delta); if (scale <= 1.01) { tx = 0; ty = 0; } apply(); };
  const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);

  stage.addEventListener('wheel', e => {
    e.preventDefault();
    scale = clampScale(scale + (e.deltaY < 0 ? 0.4 : -0.4));
    if (scale <= 1.01) { tx = 0; ty = 0; }
    apply();
  }, { passive: false });

  stage.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchStartDist = dist(e.touches[0], e.touches[1]); pinchStartScale = scale; swipeStartX = null;
    } else if (e.touches.length === 1) {
      swipeStartX = e.touches[0].clientX;
      if (scale > 1.01) { dragging = true; dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY; dragOrigTx = tx; dragOrigTy = ty; }
    }
  }, { passive: true });

  stage.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchStartDist) {
      e.preventDefault();
      scale = clampScale(pinchStartScale * (dist(e.touches[0], e.touches[1]) / pinchStartDist));
      if (scale <= 1.01) { tx = 0; ty = 0; }
      apply();
    } else if (dragging && e.touches.length === 1) {
      e.preventDefault();
      tx = dragOrigTx + (e.touches[0].clientX - dragStartX);
      ty = dragOrigTy + (e.touches[0].clientY - dragStartY);
      apply();
    }
  }, { passive: false });

  stage.addEventListener('touchend', e => {
    if (e.touches.length === 0) {
      pinchStartDist = 0;
      const wasDragging = dragging; dragging = false;
      if (!wasDragging && scale <= 1.01 && swipeStartX != null && e.changedTouches.length) {
        const dx = e.changedTouches[0].clientX - swipeStartX;
        if (Math.abs(dx) > 40) { navPhoto(dx > 0 ? -1 : 1); swipeStartX = null; return; }
      }
      swipeStartX = null;
      if (!wasDragging) {
        const now = Date.now();
        if (now - lastTapAt < 300) {
          if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
          scale = scale > 1.01 ? 1 : 2.5; if (scale <= 1.01) { tx = 0; ty = 0; } apply();
          lastTapAt = 0;
        } else {
          lastTapAt = now;
          tapTimer = setTimeout(() => { toggleInfo(); tapTimer = null; }, 300);
        }
      }
    }
  }, { passive: true });

  img.addEventListener('click', () => {
    if (tapTimer) return;
    tapTimer = setTimeout(() => { toggleInfo(); tapTimer = null; }, 260);
  });
  img.addEventListener('dblclick', () => {
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
    scale = scale > 1.01 ? 1 : 2.5; if (scale <= 1.01) { tx = 0; ty = 0; } apply();
  });
}
function zoomBy(delta) { if (window.__phZoomBy) window.__phZoomBy(delta); }

// ---- Share (BRO: "need unnavi share option kuda ravali") — shares the item's real Drive link (not
// the resized thumbnail URL) so whoever receives it can open the actual full photo. Uses the native
// share sheet where available (phones, most tablets); falls back to copying the link, then to just
// opening it in a new tab if even clipboard access isn't available. ----
async function sharePhoto() {
  const r = PH.items[PH.openIdx]; if (!r || !r.photo) return;
  const title = (r.tagNo || r.productName || 'Photo') + ' — VSR GOLD';
  const url = r.photo;
  if (navigator.share) {
    try { await navigator.share({ title, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try { await navigator.clipboard.writeText(url); toastMsg('Photo link copied — paste it anywhere to share'); return; } catch (e) {}
  }
  window.open(url, '_blank');
}
function toastMsg(msg) {
  const old = document.getElementById('phToast'); if (old) old.remove();
  const t = document.createElement('div');
  t.id = 'phToast';
  t.textContent = msg;
  t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#241A33;color:#fff;padding:10px 18px;border-radius:24px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.3);';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function toggleInfo() {
  PH.infoOpen = !PH.infoOpen;
  const box = document.getElementById('phInfoBox');
  if (!box) return;
  if (PH.infoOpen) { box.innerHTML = infoHtml(PH.items[PH.openIdx]); box.style.display = 'block'; }
  else box.style.display = 'none';
}
async function renderStage() {
  const r = PH.items[PH.openIdx]; if (!r) return;
  const img = document.getElementById('phStageImg');
  const lbl = document.getElementById('phCtrLbl');
  const box = document.getElementById('phInfoBox');
  img.removeAttribute('src'); img.alt = 'Loading...';
  lbl.textContent = (r.tagNo || r.productName || 'Item') + '  ·  ' + (PH.openIdx + 1) + ' / ' + PH.items.length + (r.status === 'sold' ? '  ·  SOLD' : '  ·  IN STOCK');
  if (box) box.style.display = 'none';
  const src = await resolveImgSrc(r.photo);
  // the person may have swiped to a different photo while this one was still downloading
  if (PH.items[PH.openIdx] !== r) return;
  if (src) img.src = src; else img.alt = '📷 Not downloaded yet — connect once to view this photo offline';
}
function infoHtml(r) {
  if (!r) return '';
  const isDia = r.type === 'Diamond';
  const rows = [
    ['Type', r.type], ['Tag No', r.tagNo || '—'], ['Product', r.productName],
    !isDia ? ['Design', r.design] : null, !isDia ? ['Tunch', r.tunch] : null,
    !isDia ? ['Weight (gm)', r.weight] : null,
    isDia ? ['Gross Wt', r.gross] : null, isDia ? ['Net Wt', r.net] : null,
    isDia ? ['Carat', r.carat] : null, isDia ? ['Clarity', r.clarity] : null, isDia ? ['Color', r.color] : null,
    ['Product From', r.productFrom === 'Main' ? 'Main (Hub)' : r.productFrom], ['Counter', r.counter],
    r.status === 'sold' ? ['DSR / Outlet ID', r.dsrId] : null,
    r.status === 'sold' ? ['Sold Date', fmtDMY(r.soldDate)] : null,
    r.status === 'sold' ? ['Sold By', r.soldBy] : null,
    r.status === 'sold' ? ['Payment Status', r.payStatus] : null
  ].filter(Boolean);
  return `<table class="info">` +
    rows.map(([l, v]) => `<tr><td class="lbl">${escHtml(l)}</td><td class="val">${escHtml(v == null || v === '' ? '—' : v)}</td></tr>`).join('') +
    `</table>`;
}

initApp();
</script>
</body>
